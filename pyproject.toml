[project]
name = "npcforge"
version = "0.7.0"
description = "Branching NPC dialogue generator with Yarn Spinner export, powered by afterimage."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Altai", email = "efe@altai.dev"}]
keywords = [
    "llm",
    "synthetic-data",
    "game-dev",
    "yarn-spinner",
    "npc",
    "dialogue",
    "afterimage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "afterimage>=0.14",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
npcforge = "npcforge.cli:main"
npcforge-mcp = "npcforge.mcp_server:main"

[project.urls]
Homepage = "https://github.com/altaidevorg/npcforge"
Repository = "https://github.com/altaidevorg/npcforge"
Issues = "https://github.com/altaidevorg/npcforge/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
