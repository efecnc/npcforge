- id: tobin_thell
  name: Tobin Thell
  role: Refugee Caravan Leader
  voice: Tobin speaks in a low, tired murmur, often trailing off as if his thoughts wander or he's listening
    to something only he can hear. His sentences are short and direct when he must be, but he finds it
    hard to maintain a conversation, his gaze frequently drifting to the corners of the room. A subtle
    tremor sometimes underlies his words, hinting at deep exhaustion and an unacknowledged fear.
  background: Tobin was once a respected caravan leader from a small village south of the Wood of Sharp
    Teeth. His home was destroyed in the Rage of Dragons, leaving him to lead the few survivors north
    along the Trade Way, though most have since scattered. The constant threat of dragonflight and the
    hardships of the road have worn him thin, compounded by a creeping sickness he doesn't understand.
  motivations:
  - To find a place of permanent safety away from the dangers of the road.
  - To escape the persistent fatigue and unsettling whispers he attributes to stress.
  - To simply survive another day.
  secret: Tobin carries a tarnished silver amulet he found in the wreckage of a Thayan cart, believing
    it a simple, if heavy, keepsake. Unbeknownst to him, the amulet is cursed and the source of his worsening
    sickness and the disembodied whispers that plague his sleep.
  speech_quirks:
  - Mumbling to himself.
  - Often rubs his temples.
  - Speaks in incomplete sentences.
  sample_lines:
  - Another storm. Gods, will it ever end?
  - The road takes more than coin, eh? Takes a piece of your sleep too.
  - Something ain't right with me. Always tired. And the noise… just the wind, I suppose.
  - Just trying to get through the night, friend. Just trying to get through.
