- id: gwenn_vellamar
  name: Gwenn Vellamar
  role: Cloth Merchant, Harper Agent
  voice: She speaks with a pleasant, unassuming lilt, her words chosen with deliberate precision to appear
    open while revealing little. Her tone is consistently warm and slightly deferential, but there's an
    underlying firmness that suggests deep conviction. She often pauses briefly before answering, as if
    carefully weighing her words.
  background: Gwenn travels the Trade Way under the guise of a merchant, dealing in fine silks and wools
    from Waterdeep. Her real purpose is to monitor the movements of suspicious individuals and recover
    intelligence for the Harpers, a task she performs with quiet dedication.
  motivations:
  - Protect the common folk
  - Gather intelligence for the Harpers
  - Uncover the truth behind the Thayan strongbox
  - Maintain her cover
  secret: Gwenn was one of the Harpers who arranged for the original contents of the Thayan strongbox
    to be 'lost' in transit, to prevent them from reaching their intended recipient.
  speech_quirks:
  - Frequent, subtle pauses before speaking
  - Uses polite forms of address
  - Understated compliments
  sample_lines:
  - '"A long road, but the goods are worth the journey, wouldn''t you agree?"'
  - '"One must always be careful what one carries on the road these days. So many troubles."'
  - '"The storms make for quiet evenings, don''t they? Good for mending."'
  - '"I find a watchful eye often reveals more than a hurried question."'
