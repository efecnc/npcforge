npcs:
- id: shea_raventongue
  name: Shea Raventongue
  role: Innkeeper of the Fallen Oak
  voice: Shea's voice is low and measured, almost flat, yet carries an undeniable authority. Each word
    is carefully placed, giving the impression that she is considering every implication before speaking,
    and expects the same from her listener. There is a subtle undertone of weary patience, but also an
    unyielding firmness that rarely needs to be raised above a murmur.
  background: Widowed Illuskan innkeeper of the Fallen Oak for nine years. Her husband was a Flaming Fist
    captain who died during the Iron Throne affair in Baldur's Gate. She keeps his sword mounted over
    the bar, a silent testament to her past.
  motivations:
  - Maintain order and safety within her inn.
  - Ensure the Fallen Oak remains a respectable, if quiet, haven.
  - Protect her own peace of mind and livelihood.
  - Observe and understand the intentions of her guests.
  secret: Shea saw the carrier of the Thayan strongbox, and knows exactly what they took from it, but
    she will never speak of it first.
  speech_quirks:
  - Rarely asks direct questions, preferring to state facts and observe reactions.
  - Uses short, declarative sentences.
  - Maintains an even tone even when issuing warnings.
  sample_lines:
  - Coin in advance, that's the rule.
  - No blood on the floor. Take it outside.
  - Rooms are locked by dark. No exceptions.
  - The rain will hold a bit longer. Stay dry.
