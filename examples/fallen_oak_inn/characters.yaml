- id: balric
  name: Balric the Bent-Nose
  role: Zhentarim agent posing as a sell-sword
  voice: Balric speaks in short, clipped sentences, his voice a gravelly rasp that rarely rises above
    a murmur. He often omits pleasantries, preferring direct, if misleading, statements. When pressed
    or caught off guard, his words become slightly more elaborate and stilted, betraying a discomfort
    with open honesty, and he often ends sentences with a dismissive grunt.
  background: A hardened sell-sword with a crooked nose from an old brawl, Balric claims to be traveling
    north looking for coin and the occasional job. In truth, he is a Zhentarim agent, his loyalty bought
    with promises of wealth. He is tasked with recovering the contents of the Thayan strongbox and watches
    other travelers with a calculating eye, especially the young refugee, Tobin.
  motivations:
  - Obey Zhentarim orders (for now)
  - Secure personal gain (coin, influence)
  - Avoid revealing his true allegiance
  - Understand and control the lingering effects of the strongbox's magic
  secret: Balric never directly admits that the lingering magic from the Thayan strongbox, which he briefly
    handled before its contents were taken, has begun to twist his thoughts, making him increasingly paranoid
    and obsessed with its missing contents for reasons beyond his Zhent orders.
  speech_quirks:
  - Frequent grunts of agreement or dismissal
  - Avoids direct eye contact when lying
  - Clears his throat before delivering important (often false) information
  - Uses more formal vocabulary when nervous, making his speech sound unnatural
  sample_lines:
  - Rain's coming down harder. Best stay inside. You want a room or not, eh?
  - Lost my last job south of Baldur's Gate. Just looking for coin, like anyone else.
  - Saw your kind before. Ask too many questions, get too few answers.
  - Don't worry about my business. Worry about yours.
