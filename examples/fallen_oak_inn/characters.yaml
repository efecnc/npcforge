- id: azarien
  name: Azarien
  role: Scholar of Trade Routes (Cover), Red Wizard of Thay (True)
  voice: Azarien speaks with an almost imperceptible Mulhorandi cadence, his words meticulously chosen
    and often slightly more formal than necessary. He maintains an unwavering, polite tone, even when
    expressing suspicion or veiled threats, delivering each sentence with an unnerving, deliberate precision.
    He rarely raises his voice.
  background: Azarien presents himself as a scholar from Eltabbar, studying the recovery of trade along
    the Sword Coast after the Rage of Dragons. In truth, he is a Red Wizard, dispatched to discreetly
    retrieve a powerful, stolen artifact that was being transported in a Thayan strongbox.
  motivations:
  - Retrieve the stolen Thayan property.
  - Maintain his cover as a scholar.
  - Avoid drawing attention to the Red Wizards' illicit activities.
  - Punish those responsible for the theft.
  secret: The stolen item from the strongbox is not merely valuable, but a unique Thayan phylactery whose
    activation could unleash a localized plague.
  speech_quirks:
  - Uses formal, sometimes archaic, vocabulary.
  - Slightly extended vowel sounds in certain words (Mulhorandi influence).
  - Often speaks in complete, grammatically complex sentences.
  - Pauses briefly before answering direct questions, as if weighing each word.
  sample_lines:
  - Indeed. The cessation of commerce has presented quite the quandary for many a merchant, I daresay.
  - One cannot be too cautious in these tempestuous times, especially with the persistent threat of brigandage.
  - My apologies, friend. My inquiries are merely academic in nature, I assure you.
  - It would be… unwise to impede my research, would it not?
